name: CI

# Minimal CI: headless checks on the non-GUI code (models / simulation /
# config / dem / batch). The tkinter GUI layer (views/*) can't run on a
# headless runner, so it is exercised only by pyright's static check, not pytest.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # matplotlib must not try to open a display
      # Declare that this runner has no display, so tests/conftest.py may skip the
      # GUI layer. Without this declaration a failure to start Tk is a *failure*,
      # not a skip -- on a machine that does have a display, "skipped" would hide
      # a run in which no GUI wiring was checked at all (observed 2026-08-07:
      # 106 of 112 tests skipped, exit code 0).
      RADIOSIM_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # 開発依存は requirements-dev.txt が唯一の宣言場所（I-037）。ここへインラインで
      # 書き足すと、CI とローカルとで別の版を使いながら両方緑になり得る。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (syntax + pyflakes)
        run: ruff check .          # config from pyproject.toml [tool.ruff]

      - name: Bandit (security static analysis)
        # 設定は pyproject.toml [tool.bandit]。-ll で Severity>=Medium のみゲート化
        # （Low はローカル Stop-hook の助言に委ね、CI は実害級だけで落とす）。
        run: bandit -r . -c pyproject.toml -ll -q

      # 対象は**層のディレクトリ**（2.7 スライス H・I-058）。ファイルを 43 件
      # 手で並べていたが、モジュールを足すたびに書き足す作業が要り、書き忘れれば
      # そのファイルだけ黙って型検査の外に出る。ディレクトリなら追従が要らない。
      # ⚠️ ローカルの pytest からも同じ対象で回る（B-049 で降ろした
      # tests/test_repo_hygiene.py::test_pyright_finds_no_type_errors_in_app_modules
      # がこの行を読む）＝push を待たずに鳴る。
      - name: Pyright (type check, app modules)
        run: >-
          pyright
          core report views main.py
          buildtools/check_bundle_imports.py

      - name: Pytest (with coverage gate)
        run: python -m pytest --cov
