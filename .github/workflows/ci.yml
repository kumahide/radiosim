name: CI

# Minimal CI: headless checks on the non-GUI code (models / simulation /
# config / dem / batch). The tkinter GUI layer (views/*) can't run on a
# headless runner, so it is exercised only by pyright's static check, not pytest.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # matplotlib must not try to open a display
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # 開発依存は requirements-dev.txt が唯一の宣言場所（I-037）。ここへインラインで
      # 書き足すと、CI とローカルとで別の版を使いながら両方緑になり得る。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (syntax + pyflakes)
        run: ruff check .          # config from pyproject.toml [tool.ruff]

      - name: Bandit (security static analysis)
        # 設定は pyproject.toml [tool.bandit]。-ll で Severity>=Medium のみゲート化
        # （Low はローカル Stop-hook の助言に委ね、CI は実害級だけで落とす）。
        run: bandit -r . -c pyproject.toml -ll -q

      - name: Pyright (type check, app modules)
        run: >-
          pyright
          batch.py scenario.py models.py simulation.py config.py dem.py version.py
          report_common.py report_path.py report_summary.py report_scenario.py
          multihop.py report_multihop.py project.py
          report_map.py
          i18n.py main.py map_graphics.py coords.py units.py mpl_fonts.py
          views/launcher.py views/graph.py views/batch_builder.py
          views/map_window.py views/dialogs.py views/progress.py views/theme.py
          views/window_fit.py
          views/scenario.py views/multihop.py

      - name: Pytest (with coverage gate)
        run: python -m pytest --cov
