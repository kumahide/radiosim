<svg xmlns="http://www.w3.org/2000/svg" viewBox="255 15 1745 470" width="1745" height="470">
<!--
  RadioSim Link のロゴとアイコンの元（I-238・Link 1.0 ステージ8e）。座標は旧 logo.png（2172x502）のまま。
  画面はこの SVG をそのまま描く（表示倍率に追従する）。exe とインストーラのアイコン（icon.ico）は
  buildtools/build_link.py が <g id="icon"> を抜き出し、<use> を展開して単独の SVG にしてから Tk 9 で焼く。
  ⚠️ icon と mark の中は図形と表示属性だけで書く＝Tk の SVG 読み（nanosvg）は <text>・<use>・<style> を描かない。
-->
<style>
  .word { font-family: "Segoe UI", sans-serif; font-weight: 700; font-size: 294px; }
  .grey { fill: #78838b; }
  .blue { fill: #2179ad; }
  .bear { fill: #757b80; }
  .edition { font-family: "Segoe UI", sans-serif; font-weight: 400; font-size: 130px; fill: #343c43; }
  @media (prefers-color-scheme: dark) {
    .edition { fill: #f2f4f5; }
  }
</style>
<defs>
  <!-- 電波の印＝i の点が源。中心が原点・点は半径 22・弧は真上から真右までの四分円 4 本 -->
  <g id="mark">
    <g fill="none" stroke="#7e8e98" stroke-width="11" stroke-linecap="butt">
      <path d="M0 -48A48 48 0 0 1 48 0"/>
      <path d="M0 -75A75 75 0 0 1 75 0"/>
      <path d="M0 -101A101 101 0 0 1 101 0"/>
      <path d="M0 -127A127 127 0 0 1 127 0"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="#2179ad"/>
  </g>
  <!-- アプリのアイコン（256 四方）。data-viewbox は抜き出した SVG の viewBox -->
  <g id="icon" data-viewbox="0 0 256 256">
    <rect x="0" y="0" width="256" height="256" rx="36" fill="#343c43"/>
    <use href="#mark" transform="translate(57 199) scale(1.3)"/>
  </g>
</defs>
