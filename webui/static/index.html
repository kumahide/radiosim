<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioSim</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="band" data-kind="computing">
  <span id="band-word"></span>
  <span id="band-detail"></span>
</header>
<main>
  <aside id="inputs">
    <label><span data-label="start"></span><input data-key="start" spellcheck="false"></label>
    <label><span data-label="end"></span><input data-key="end" spellcheck="false"></label>
    <label><span data-label="h_tx"></span><input data-key="h_tx" inputmode="decimal"></label>
    <label><span data-label="h_rx"></span><input data-key="h_rx" inputmode="decimal"></label>
    <label><span data-label="freq"></span><input data-key="freq" inputmode="decimal"></label>
  </aside>
  <section id="view">
    <div id="map"></div>
    <div id="profile"><span data-label="profile_later"></span></div>
  </section>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
