<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioSim</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="band" data-kind="computing">
  <span id="band-word"></span>
  <span id="band-detail"></span>
  <span id="band-range"></span>
  <span id="band-flipped"></span>
</header>
<main>
  <aside id="inputs">
    <div id="form"></div>
    <section id="budget">
      <h2 data-label="budget"></h2>
      <table id="breakdown"></table>
    </section>
  </aside>
  <section id="view">
    <div id="map"></div>
    <div id="profile">
      <ul id="legend">
        <li class="terrain" data-label="legend_terrain"></li>
        <li class="vegetation" data-label="legend_vegetation"></li>
        <li class="los" data-label="legend_los"></li>
        <li class="fresnel" data-label="legend_fresnel"></li>
      </ul>
      <canvas id="profile-canvas"></canvas>
    </div>
  </section>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
