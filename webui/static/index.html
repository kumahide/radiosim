<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioSim Link</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-ws="single">
<header id="band" data-kind="computing">
  <span id="band-word"></span>
  <span id="band-detail"></span>
  <span id="band-range"></span>
  <img id="brand" src="brand.svg" alt="RadioSim Link">
  <span id="band-flipped"></span>
</header>
<main>
  <aside id="inputs">
    <div id="form"></div>
    <section id="budget">
      <h2 data-label="budget"></h2>
      <table id="breakdown"></table>
    </section>
  </aside>
  <section id="view">
    <nav id="tabs" role="tablist"></nav>
    <div id="map"></div>
    <div id="lower">
      <!-- 作業面の表（1 回線の面では隠す）＝左。右は選んだ行の断面図 -->
      <div id="sheet" hidden>
        <div id="sheet-tools"></div>
        <div id="sheet-note"></div>
        <div id="sheet-body"></div>
        <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      </div>
      <div id="profile">
        <ul id="legend">
          <li class="terrain" data-label="legend_terrain"></li>
          <li class="vegetation" data-label="legend_vegetation"></li>
          <li class="los" data-label="legend_los"></li>
          <li class="fresnel" data-label="legend_fresnel"></li>
        </ul>
        <canvas id="profile-canvas"></canvas>
      </div>
    </div>
  </section>
</main>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
