  <!-- ④ 注意 -->
  <text x="30" y="1420" font-size="18" font-weight="bold" fill="#222">④ 注意</text>
  <g fill="#222">
    <text x="30" y="1450">・必須は E220 まわりの 6 本（UART 2 本・M0・M1・VCC・GND）と 2.4 GHz のアンテナ。AUX と UART0（ログ）は任意。</text>
    <text x="30" y="1474">・2.4 GHz と 920 MHz のアンテナは離して立てる。2 帯域は同時に動かさない（920 の送信が至近で 2.4 の受信段を飽和させうる・電波法の扱いが帯域ごとに別）。</text>
    <text x="30" y="1498">・100nF はリード付きで可。EV2 と XIAO をつなぐ線が 20〜30 cm を超えるなら、EV2 側に 10µF も足す。</text>
    <text x="30" y="1522">・I/O は VCC が 5V でも 3.3V のまま＝レベル変換なしで直結できる。ログ用の変換器も 3.3V のものを使う。</text>
    <text x="30" y="1546">・BAT パッドからの給電では 5V パッドに電圧が出ない。持ち出すときはモバイルバッテリを USB へ挿す。EV2 に VDD は出ていない＝電源は 5V→VCC だけ。</text>
    <text x="30" y="1570" fill="#b00">・通電前に：7 番と GND スルーホールの導通（ヘッダの向き）／XIAO の 5V パッドが 4.6〜5.0V か／</text>
    <text x="30" y="1592" fill="#b00">　EV2 の 6 番がモジュールへ素通しか／6 番↔7 番の容量（ほぼ 0 なら 100nF を付ける）。</text>
    <text x="30" y="1616" fill="#b00">・パッドと GPIO の対応は第三者のまとめから取った値。ファームを焼いたら 1 本ずつ実物で確かめる。</text>
    <text x="30" y="1640" fill="#b00">・いまのファームは 2.4 GHz だけ。E220 用（radio.c の差し替え）は未実装＝この結線は次の作り直しの前提。</text>
  </g>
</svg>
