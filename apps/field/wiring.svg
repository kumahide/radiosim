<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1700" viewBox="0 0 1260 1700" font-family="'Yu Gothic UI','Yu Gothic','Meiryo',sans-serif" font-size="14">
  <defs>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a9a4a"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d12a2a"/></marker>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#335"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fb0"/></marker>
  </defs>

  <rect width="1260" height="1700" fill="#ffffff"/>

  <!-- 表題 -->
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#222">RadioSim Field ハード構成：XIAO ESP32C6 ＋ E220-900T22S(JP) R2（評価ボード EV2）</text>
  <text x="30" y="66" fill="#555">ハード構成の正典（2026-09-27）。選んだ理由と電源・信号線の注意は apps/field/HARDWARE.md。結線を変えるときは同文書の §3 の表も同じコミットで直す</text>

  <!-- ① 全体 -->
  <text x="30" y="104" font-size="18" font-weight="bold" fill="#222">① 全体（測定機 2 台と PC）</text>

  <rect x="40" y="120" width="240" height="90" rx="8" fill="#f4f1fa" stroke="#446" stroke-width="2"/>
  <text x="160" y="148" text-anchor="middle" font-weight="bold" font-size="16">測定機（TX）</text>
  <text x="160" y="170" text-anchor="middle" font-size="12">XIAO ESP32C6 ＋ E220 EV2</text>
  <text x="160" y="188" text-anchor="middle" font-size="12" fill="#555">中身は ② と同じ</text>

  <rect x="560" y="120" width="240" height="90" rx="8" fill="#f4f1fa" stroke="#446" stroke-width="2"/>
  <text x="680" y="148" text-anchor="middle" font-weight="bold" font-size="16">測定機（RX）</text>
  <text x="680" y="170" text-anchor="middle" font-size="12">XIAO ESP32C6 ＋ E220 EV2</text>
  <text x="680" y="188" text-anchor="middle" font-size="12" fill="#555">中身は ② と同じ（同じファーム）</text>

  <path d="M284,165 l30,-12 l30,24 l30,-24 l30,24 l30,-24 l30,24 l30,-24 l30,24 l12,-6" fill="none" stroke="#7a3fb0" stroke-width="2.5" marker-end="url(#a-purple)"/>
  <text x="420" y="138" text-anchor="middle" font-size="12" fill="#7a3fb0" font-weight="bold">920 MHz（校正の主役）</text>
  <text x="420" y="200" text-anchor="middle" font-size="12" fill="#7a3fb0">2.4 GHz（同じ幾何の対照）</text>
  <text x="420" y="216" text-anchor="middle" font-size="12" fill="#b00">2 帯域は同時に動かさない（時分割）</text>

  <line x1="160" y1="210" x2="160" y2="248" stroke="#335" stroke-width="2.5" marker-end="url(#a-dark)"/>
  <text x="160" y="266" text-anchor="middle" font-size="12" fill="#335">USB：給電・設定（PC かモバイルバッテリ）</text>

  <rect x="940" y="120" width="260" height="90" rx="8" fill="#eef7ee" stroke="#363" stroke-width="2"/>
  <text x="1070" y="148" text-anchor="middle" font-weight="bold" font-size="16">記録用 PC</text>
  <text x="1070" y="170" text-anchor="middle" font-size="12" font-family="Consolas,monospace">python -m apps.field.cli record</text>
  <text x="1070" y="188" text-anchor="middle" font-size="12" fill="#555">1 回の測定を 1 フォルダに記録</text>

  <line x1="800" y1="165" x2="936" y2="165" stroke="#335" stroke-width="2.5" marker-end="url(#a-dark)"/>
  <text x="868" y="155" text-anchor="middle" font-size="12" fill="#335">USB（MAVLink v2）</text>

  <rect x="940" y="240" width="260" height="56" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1070" y="262" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">GNSS（到着待ち・1 台）</text>
  <text x="1070" y="282" text-anchor="middle" font-size="12" fill="#555">ZED-X20P（X20PX1）＋ JCA228F</text>
  <line x1="1070" y1="240" x2="1070" y2="214" stroke="#888" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a-gray)"/>
  <text x="1080" y="232" font-size="11" fill="#888">USB</text>

  <!-- ② 1 台の中身 -->
  <text x="30" y="338" font-size="18" font-weight="bold" fill="#222">② 測定機 1 台の中身（TX・RX とも同じ）</text>

  <!-- XIAO -->
  <rect x="230" y="360" width="360" height="460" rx="10" fill="#eef4fb" stroke="#335" stroke-width="2"/>
  <text x="410" y="388" text-anchor="middle" font-size="17" font-weight="bold" fill="#223">XIAO ESP32C6</text>
  <text x="410" y="406" text-anchor="middle" font-size="12" fill="#556">（母艦・ファーム・技適 202-JCE066）</text>

  <!-- XIAO 内部 -->
  <rect x="250" y="425" width="180" height="70" rx="6" fill="#ffffff" stroke="#669" stroke-width="1.5"/>
  <text x="340" y="453" text-anchor="middle" font-weight="bold">ESP32-C6</text>
  <text x="340" y="474" text-anchor="middle" font-size="12" fill="#556">2.4 GHz の無線を内蔵</text>
  <line x1="340" y1="495" x2="340" y2="525" stroke="#669" stroke-width="2"/>

  <rect x="250" y="525" width="180" height="72" rx="6" fill="#ffffff" stroke="#669" stroke-width="1.5"/>
  <text x="340" y="545" text-anchor="middle" font-size="13" font-weight="bold">RF スイッチ（基板上）</text>
  <text x="340" y="565" text-anchor="middle" font-size="12" fill="#556">GPIO3＝Low で有効</text>
  <text x="340" y="583" text-anchor="middle" font-size="12" fill="#556">GPIO14＝High で外付け</text>
  <line x1="340" y1="597" x2="340" y2="625" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="250" y="625" width="180" height="32" rx="6" fill="#f6f6f6" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="340" y="646" text-anchor="middle" font-size="12" fill="#999">チップアンテナ（使わない）</text>

  <!-- U.FL と 2.4 GHz アンテナ -->
  <line x1="250" y1="561" x2="234" y2="561" stroke="#669" stroke-width="2"/>
  <rect x="226" y="555" width="10" height="12" fill="#335"/>
  <line x1="226" y1="561" x2="120" y2="561" stroke="#7a3fb0" stroke-width="2.5"/>
  <line x1="120" y1="561" x2="120" y2="460" stroke="#7a3fb0" stroke-width="2.5"/>
  <path d="M120,460 L104,432 L136,432 Z" fill="none" stroke="#7a3fb0" stroke-width="2.5"/>
  <text x="20" y="372" font-size="13" font-weight="bold" fill="#7a3fb0">2.4 GHz ロッドアンテナ</text>
  <text x="20" y="390" font-size="12" fill="#555">M02-0600100R0A（U.FL）</text>
  <text x="20" y="408" font-size="12" fill="#555">技適 202-JCE066 の組</text>
  <text x="170" y="582" text-anchor="middle" font-size="11" fill="#7a3fb0">起動時に外付けへ固定</text>
  <text x="200" y="550" text-anchor="middle" font-size="11" fill="#335">U.FL</text>

  <!-- UART0（ログ） -->
  <g fill="#335">
    <rect x="226" y="715" width="8" height="10"/><rect x="226" y="750" width="8" height="10"/><rect x="226" y="785" width="8" height="10"/>
  </g>
  <g font-size="13" fill="#555">
    <text x="244" y="725">D6（GPIO16）UART0 TX</text>
    <text x="244" y="760">D7（GPIO17）UART0 RX</text>
    <text x="244" y="795" font-weight="bold" fill="#222">GND</text>
  </g>
  <rect x="20" y="695" width="130" height="110" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="85" y="720" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">USB-UART 変換器</text>
  <text x="85" y="738" text-anchor="middle" font-size="11" fill="#555">（3.3V・任意）</text>
  <text x="85" y="756" text-anchor="middle" font-size="11" fill="#555">ログを読むときだけ</text>
  <text x="85" y="774" text-anchor="middle" font-size="11" fill="#555">115200 bps</text>
  <text x="85" y="792" text-anchor="middle" font-size="11" fill="#555">普段は未接続</text>
  <line x1="226" y1="720" x2="152" y2="720" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-gray)"/>
  <line x1="150" y1="755" x2="224" y2="755" stroke="#888" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-gray)"/>
  <line x1="226" y1="790" x2="150" y2="790" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="188" y="713" text-anchor="middle" font-size="11" fill="#888">ログ</text>

  <!-- USB -->
  <line x1="410" y1="820" x2="410" y2="858" stroke="#335" stroke-width="3" marker-end="url(#a-dark)"/>
  <text x="410" y="878" text-anchor="middle" fill="#335" font-weight="bold">USB Type-C（USB Serial/JTAG）</text>
  <text x="410" y="897" text-anchor="middle" font-size="12" fill="#335">測定データ専用（MAVLink v2）＋ 給電 5V ／ ログは流さない</text>

  <!-- XIAO 右側のパッド名 -->
  <g font-size="15" fill="#223" text-anchor="end">
    <text x="576" y="445">D2（GPIO2）</text>
    <text x="576" y="495">D3（GPIO21）</text>
    <text x="576" y="545">D0（GPIO0）</text>
    <text x="576" y="595">D1（GPIO1）</text>
    <text x="576" y="645" fill="#777">D10（GPIO18）</text>
    <text x="576" y="705" fill="#d12a2a" font-weight="bold">5V</text>
    <text x="576" y="755" font-weight="bold">GND</text>
  </g>
  <g fill="#335">
    <rect x="586" y="435" width="8" height="10"/><rect x="586" y="485" width="8" height="10"/>
    <rect x="586" y="535" width="8" height="10"/><rect x="586" y="585" width="8" height="10"/>
    <rect x="586" y="635" width="8" height="10"/><rect x="586" y="695" width="8" height="10"/>
    <rect x="586" y="745" width="8" height="10"/>
  </g>

  <!-- EV2 -->
  <rect x="860" y="360" width="240" height="460" rx="10" fill="#fdf3e6" stroke="#533" stroke-width="2"/>
  <text x="980" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#322">E220-900T22S(JP) R2</text>
  <text x="980" y="406" text-anchor="middle" font-size="12" fill="#655">評価ボード EV2（技適 001-P01730）</text>
  <g font-size="15" fill="#322">
    <text x="876" y="445"><tspan font-weight="bold">1</tspan>　M0</text>
    <text x="876" y="495"><tspan font-weight="bold">2</tspan>　M1</text>
    <text x="876" y="545"><tspan font-weight="bold">3</tspan>　RXD</text>
    <text x="876" y="595"><tspan font-weight="bold">4</tspan>　TXD</text>
    <text x="876" y="645" fill="#777"><tspan font-weight="bold">5</tspan>　AUX（任意）</text>
    <text x="876" y="705" fill="#d12a2a"><tspan font-weight="bold">6</tspan>　VCC</text>
    <text x="876" y="755"><tspan font-weight="bold">7</tspan>　GND</text>
  </g>
  <g fill="#533">
    <rect x="856" y="435" width="8" height="10"/><rect x="856" y="485" width="8" height="10"/>
    <rect x="856" y="535" width="8" height="10"/><rect x="856" y="585" width="8" height="10"/>
    <rect x="856" y="635" width="8" height="10"/><rect x="856" y="695" width="8" height="10"/>
    <rect x="856" y="745" width="8" height="10"/>
  </g>
  <g fill="none" stroke="#533" stroke-width="2">
    <circle cx="1070" cy="725" r="6"/><circle cx="1070" cy="747" r="6"/><circle cx="1070" cy="769" r="6"/>
  </g>
  <text x="1088" y="800" text-anchor="end" font-size="12" fill="#533">GND スルーホール ×3</text>

  <!-- SMA と 920 MHz アンテナ -->
  <rect x="1100" y="463" width="12" height="14" fill="#533"/>
  <path d="M1106,462 l6,8 l-6,8 l-6,-8 z" fill="#d12a2a"/>
  <line x1="1112" y1="470" x2="1170" y2="470" stroke="#7a3fb0" stroke-width="2.5"/>
  <line x1="1170" y1="470" x2="1170" y2="420" stroke="#7a3fb0" stroke-width="2.5"/>
  <path d="M1170,420 L1154,392 L1186,392 Z" fill="none" stroke="#7a3fb0" stroke-width="2.5"/>
  <text x="1170" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3fb0">920 MHz アンテナ</text>
  <text x="1140" y="460" text-anchor="middle" font-size="11" fill="#533">SMA</text>
  <text x="1180" y="498" text-anchor="middle" font-size="12" fill="#555">技適対象品</text>
  <text x="1180" y="515" text-anchor="middle" font-size="12" fill="#555">3 dBi 以下</text>
  <text x="1180" y="545" text-anchor="middle" font-size="12" fill="#d12a2a" font-weight="bold">◆ 校正の基準面</text>
  <text x="1180" y="562" text-anchor="middle" font-size="12" fill="#d12a2a">＝EV2 の SMA 端</text>

  <!-- 配線（XIAO ↔ EV2） -->
  <line x1="594" y1="440" x2="854" y2="440" stroke="#e07b00" stroke-width="3" marker-end="url(#a-orange)"/>
  <text x="724" y="432" text-anchor="middle" fill="#e07b00">M0（出力）</text>
  <line x1="594" y1="490" x2="854" y2="490" stroke="#e07b00" stroke-width="3" marker-end="url(#a-orange)"/>
  <text x="724" y="482" text-anchor="middle" fill="#e07b00">M1（出力）</text>
  <line x1="594" y1="540" x2="854" y2="540" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/>
  <text x="724" y="532" text-anchor="middle" fill="#1f6fd1">UART1 TX → EV2 の RXD</text>
  <line x1="854" y1="590" x2="596" y2="590" stroke="#1a9a4a" stroke-width="3" marker-end="url(#a-green)"/>
  <text x="724" y="582" text-anchor="middle" fill="#1a9a4a">EV2 の TXD → UART1 RX</text>
  <line x1="854" y1="640" x2="596" y2="640" stroke="#888" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a-gray)"/>
  <text x="724" y="632" text-anchor="middle" fill="#888">AUX（任意・未使用なら開放）</text>
  <line x1="594" y1="700" x2="854" y2="700" stroke="#d12a2a" stroke-width="3.5" marker-end="url(#a-red)"/>
  <text x="690" y="692" text-anchor="middle" fill="#d12a2a">電源 5V（USB 由来）</text>
  <line x1="594" y1="750" x2="856" y2="750" stroke="#222" stroke-width="3.5"/>
  <text x="690" y="742" text-anchor="middle" fill="#222">GND</text>

  <!-- 100nF（6 番↔7 番） -->
  <circle cx="820" cy="700" r="4" fill="#222"/>
  <circle cx="820" cy="750" r="4" fill="#222"/>
  <line x1="820" y1="700" x2="820" y2="719" stroke="#222" stroke-width="2"/>
  <line x1="806" y1="719" x2="834" y2="719" stroke="#222" stroke-width="3"/>
  <line x1="806" y1="731" x2="834" y2="731" stroke="#222" stroke-width="3"/>
  <line x1="820" y1="731" x2="820" y2="750" stroke="#222" stroke-width="2"/>
  <text x="798" y="729" text-anchor="end" font-weight="bold" fill="#222">100nF</text>

  <!-- ③ 結線表 -->
  <text x="30" y="945" font-size="18" font-weight="bold" fill="#222">③ 結線表</text>
  <g transform="translate(40,960)">
    <rect x="0" y="0" width="1180" height="32" fill="#dfe6ee"/>
    <!-- 群ごとの地色：E220（1〜7 行）・ログ（8〜10 行）・アンテナと USB（11〜12 行） -->
    <rect x="0" y="32" width="1180" height="224" fill="#fffaf2"/>
    <rect x="0" y="256" width="1180" height="96" fill="#f4f4f4"/>
    <rect x="0" y="352" width="1180" height="64" fill="#f1f5fb"/>
    <g font-weight="bold" fill="#222">
      <text x="10" y="21">XIAO 側</text>
      <text x="140" y="21">GPIO</text>
      <text x="210" y="21">向き</text>
      <text x="300" y="21">つなぐ先</text>
      <text x="580" y="21">備考</text>
    </g>
    <g fill="#222">
      <text x="10" y="53">D2</text><text x="140" y="53">2</text><text x="210" y="53">出力 ▶</text><text x="300" y="53">EV2 <tspan font-weight="bold">1</tspan> 番 M0</text><text x="580" y="53">通常は Low。設定モードで切り替え（モジュール内で pull-up）</text>
      <text x="10" y="85">D3</text><text x="140" y="85">21</text><text x="210" y="85">出力 ▶</text><text x="300" y="85">EV2 <tspan font-weight="bold">2</tspan> 番 M1</text><text x="580" y="85">同上。M0 と独立に動かす</text>
      <text x="10" y="117">D0</text><text x="140" y="117">0</text><text x="210" y="117">出力 ▶</text><text x="300" y="117">EV2 <tspan font-weight="bold">3</tspan> 番 RXD</text><text x="580" y="117">UART1 TX。送信と受信を交差させる</text>
      <text x="10" y="149">D1</text><text x="140" y="149">1</text><text x="210" y="149">◀ 入力</text><text x="300" y="149">EV2 <tspan font-weight="bold">4</tspan> 番 TXD</text><text x="580" y="149">UART1 RX。送信と受信を交差させる</text>
      <g fill="#777"><text x="10" y="181">D10</text><text x="140" y="181">18</text><text x="210" y="181">◀ 入力</text><text x="300" y="181">EV2 <tspan font-weight="bold">5</tspan> 番 AUX（任意）</text><text x="580" y="181">使うなら 5 番↔7 番に 100nF。未使用なら開放</text></g>
      <text x="10" y="213" fill="#d12a2a" font-weight="bold">5V</text><text x="140" y="213">—</text><text x="210" y="213">電源 ▶</text><text x="300" y="213">EV2 <tspan font-weight="bold">6</tspan> 番 VCC</text><text x="580" y="213">3.1〜5.5V。6 番↔7 番に 100nF</text>
      <text x="10" y="245" font-weight="bold">GND</text><text x="140" y="245">—</text><text x="210" y="245">—</text><text x="300" y="245">EV2 <tspan font-weight="bold">7</tspan> 番 GND</text><text x="580" y="245">スルーホール 3 つも GND。帰り線をもう 1 本</text>
      <g fill="#555"><text x="10" y="277">D6</text><text x="140" y="277">16</text><text x="210" y="277">出力 ▶</text><text x="300" y="277">USB-UART 変換器の RX（任意）</text><text x="580" y="277">UART0 TX＝ログの出口。E220 には使わない</text></g>
      <g fill="#555"><text x="10" y="309">D7</text><text x="140" y="309">17</text><text x="210" y="309">◀ 入力</text><text x="300" y="309">USB-UART 変換器の TX（任意）</text><text x="580" y="309">UART0 RX。E220 には使わない</text></g>
      <g fill="#555"><text x="10" y="341" font-weight="bold">GND</text><text x="140" y="341">—</text><text x="210" y="341">—</text><text x="300" y="341">USB-UART 変換器の GND（任意）</text><text x="580" y="341">ログを読むときだけ</text></g>
      <text x="10" y="373">U.FL</text><text x="140" y="373">3・14</text><text x="210" y="373">—</text><text x="300" y="373">2.4 GHz ロッドアンテナ</text><text x="580" y="373">ファームが起動時に外付けへ固定（GPIO3＝Low・GPIO14＝High）</text>
      <text x="10" y="405">USB Type-C</text><text x="140" y="405">—</text><text x="210" y="405">双方向</text><text x="300" y="405">記録用 PC（TX 側は給電だけでも可）</text><text x="580" y="405">USB Serial/JTAG＝測定データ専用＋給電。ログは流さない</text>
    </g>
    <g stroke="#ccc" stroke-width="1">
      <line x1="0" y1="32" x2="1180" y2="32"/><line x1="0" y1="64" x2="1180" y2="64"/>
