<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1278 1266" width="1278" height="1266"
     role="img" aria-labelledby="ttl desc" font-family="'BIZ UDPGothic','Meiryo','Yu Gothic','Hiragino Sans',sans-serif">
  <!-- 生成物（B-209）: 手で直さない。表を直して作り直す（開発者ガイド「レイヤー構成」）。 -->
  <title id="ttl">RadioSim Pro レイヤー構成</title>
  <desc id="desc">層は views / report / core の 3 つ。依存は views → report → core の一方向で、各層に属するモジュールを役割つきで並べた図。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8892a4"/>
    </marker>
    <style>
      .band  { stroke-width:1.5 }
      .card  { fill:#ffffff; stroke-width:1 }
      .lname { font-size:16px; font-weight:700 }
      .lrule { font-size:12.5px; fill:#5b6270 }
      .ctitle{ font-size:12.5px; font-weight:700 }
      .mod   { font-size:13px; font-family:Consolas,'Courier New',monospace; fill:#1f2430 }
      .role  { font-size:11.5px; fill:#5b6270 }
      .note  { font-size:12px; fill:#5b6270 }
      .arrow { stroke:#8892a4; stroke-width:2; marker-end:url(#ar) }
    </style>
  </defs>

  <rect width="1278" height="1266" fill="#ffffff"/>

  <text x="20" y="34" font-size="21" font-weight="700" fill="#1f2430">RadioSim Pro — レイヤー構成</text>
  <text x="20" y="57" class="note">層はディレクトリで表す。依存は views → report → core の一方向で、2 つの層から使うものは「下」へ置く（shared/ のような箱は作らない）。</text>

  <!-- views -->
  <rect class="band" x="20" y="76" width="1238" height="348" rx="10" fill="#eef2fb" stroke="#c3d0ec"/>
  <text x="34" y="100" class="lname" fill="#24406e">views/ — 画面（tkinter）</text>
  <text x="1244" y="100" class="lrule" text-anchor="end">副作用あり。計算と I/O は下の層へ委譲する。</text>
  <g>
    <rect class="card" x="34" y="124" width="395" height="116" rx="6" stroke="#c3d0ec"/>
    <text x="46" y="141" class="ctitle" fill="#24406e">ランチャー（本体＋ Mixin）</text>
    <text x="46" y="162" class="mod">launcher.py</text> <text x="214" y="162" class="role">本体＝入力・実行・進捗</text>
    <text x="46" y="182" class="mod">launcher_menu.py</text> <text x="214" y="182" class="role">メニューバーと操作</text>
    <text x="46" y="202" class="mod">launcher_project.py</text> <text x="214" y="202" class="role">.rsproj の保存・読込</text>
    <text x="46" y="222" class="mod">launcher_windows.py</text> <text x="214" y="222" class="role">子窓の開閉と通知</text>
    <rect class="card" x="443" y="124" width="399" height="136" rx="6" stroke="#c3d0ec"/>
    <text x="455" y="141" class="ctitle" fill="#24406e">地図（本体＋ Mixin）</text>
    <text x="455" y="162" class="mod">map_window.py</text> <text x="623" y="162" class="role">本体＝モード切替</text>
    <text x="455" y="182" class="mod">map_picks.py</text> <text x="623" y="182" class="role">地点の指定と経路の描画</text>
    <text x="455" y="202" class="mod">map_cache.py</text> <text x="623" y="202" class="role">DEM キャッシュの操作</text>
    <text x="455" y="222" class="mod">map_adapter.py</text> <text x="623" y="222" class="role">tkintermapview の唯一の依存点</text>
    <text x="455" y="242" class="mod">map_style.py</text> <text x="623" y="242" class="role">描画定数の単一ソース</text>
    <rect class="card" x="856" y="124" width="388" height="116" rx="6" stroke="#c3d0ec"/>
    <text x="868" y="141" class="ctitle" fill="#24406e">複数経路（本体＋ Mixin）</text>
    <text x="868" y="162" class="mod">batch_builder.py</text> <text x="1036" y="162" class="role">本体＝共通設定・案件</text>
    <text x="868" y="182" class="mod">batch_table.py</text> <text x="1036" y="182" class="role">入力表（行の操作）</text>
    <text x="868" y="202" class="mod">batch_io.py</text> <text x="1036" y="202" class="role">CSV 入出力と雛形</text>
    <text x="868" y="222" class="mod">batch_run.py</text> <text x="1036" y="222" class="role">実行と進捗</text>
  </g>
  <g>
    <rect class="card" x="34" y="274" width="395" height="116" rx="6" stroke="#c3d0ec"/>
    <text x="46" y="291" class="ctitle" fill="#24406e">そのほかの窓</text>
    <text x="46" y="312" class="mod">graph.py</text> <text x="214" y="312" class="role">グラフ窓</text>
    <text x="46" y="332" class="mod">scenario.py</text> <text x="214" y="332" class="role">条件探索（比較 / スイープ）</text>
    <text x="46" y="352" class="mod">multihop.py</text> <text x="214" y="352" class="role">中継経路（地点が入力面）</text>
    <text x="46" y="372" class="mod">multihop_map.py</text> <text x="214" y="372" class="role">中継経路と地図の受け渡し</text>
    <rect class="card" x="443" y="274" width="801" height="136" rx="6" stroke="#c3d0ec"/>
    <text x="455" y="291" class="ctitle" fill="#24406e">全窓で共有する部品</text>
    <text x="455" y="312" class="mod">dialogs.py</text> <text x="623" y="312" class="role">親中央のモーダル</text>
    <text x="455" y="332" class="mod">errors.py</text> <text x="623" y="332" class="role">未捕捉例外の受け皿</text>
    <text x="455" y="352" class="mod">progress.py</text> <text x="623" y="352" class="role">進捗の伝送（キュー）</text>
    <text x="455" y="372" class="mod">frozen_common.py</text> <text x="623" y="372" class="role">凍結帯の項目の単一ソース</text>
    <text x="868" y="312" class="mod">theme.py</text> <text x="1036" y="312" class="role">テーマ色・UI 書体</text>
    <text x="868" y="332" class="mod">window_fit.py</text> <text x="1036" y="332" class="role">窓の寸法（見切れ防止）</text>
    <text x="868" y="352" class="mod">tooltip.py</text> <text x="1036" y="352" class="role">入力ヒント</text>
    <text x="868" y="372" class="mod">window_scroll.py</text> <text x="1036" y="372" class="role">入らない時の逃げ道</text>
    <text x="868" y="392" class="mod">title_bar.py</text> <text x="1036" y="392" class="role">タイトルバー（OS 描画）</text>
  </g>

  <line class="arrow" x1="639" y1="428" x2="639" y2="452"/>

  <!-- report -->
  <rect class="band" x="20" y="456" width="1238" height="268" rx="10" fill="#eefaf3" stroke="#bfe3d1"/>
  <text x="34" y="480" class="lname" fill="#1c5c3f">report/ — 出力を作る層</text>
  <text x="1244" y="480" class="lrule" text-anchor="end">ヘッドレス＝画面が無くても動く（テスト・CI もここを直接まわす）。</text>
  <g>
    <rect class="card" x="34" y="504" width="395" height="116" rx="6" stroke="#bfe3d1"/>
    <text x="46" y="521" class="ctitle" fill="#1c5c3f">実行エンジン</text>
    <text x="46" y="542" class="mod">batch.py</text> <text x="214" y="542" class="role">複数経路（CSV・一括実行）</text>
    <text x="46" y="562" class="mod">multihop.py</text> <text x="214" y="562" class="role">中継経路（区間を導出・min）</text>
    <text x="46" y="582" class="mod">project.py</text> <text x="214" y="582" class="role">.rsproj の読み書き</text>
    <text x="46" y="602" class="mod">residuals.py</text> <text x="214" y="602" class="role">PathResult → 残差標本の抽出</text>
    <rect class="card" x="443" y="504" width="801" height="96" rx="6" stroke="#bfe3d1"/>
    <text x="455" y="521" class="ctitle" fill="#1c5c3f">成果物の生成</text>
    <text x="455" y="542" class="mod">report_common.py</text> <text x="623" y="542" class="role">A4 骨格・ヘッダ / フッタ</text>
    <text x="455" y="562" class="mod">report_path.py</text> <text x="623" y="562" class="role">経路ごと（PNG/HTML/KML）</text>
    <text x="455" y="582" class="mod">report_summary.py</text> <text x="623" y="582" class="role">サマリ・全ページ連結</text>
    <text x="868" y="542" class="mod">report_scenario.py</text> <text x="1036" y="542" class="role">条件探索（折れ線＋表）</text>
    <text x="868" y="562" class="mod">report_multihop.py</text> <text x="1036" y="562" class="role">中継（合成シート・hops.csv）</text>
    <text x="868" y="582" class="mod">report_map.py</text> <text x="1036" y="582" class="role">経路地図（タイル取得＋合成）</text>
  </g>
  <g>
    <rect class="card" x="34" y="634" width="395" height="76" rx="6" stroke="#bfe3d1"/>
    <text x="46" y="651" class="ctitle" fill="#1c5c3f">共有する描画部品</text>
    <text x="46" y="672" class="mod">map_graphics.py</text> <text x="214" y="672" class="role">地図の重ね描き（純 PIL）</text>
    <text x="46" y="692" class="mod">mpl_fonts.py</text> <text x="214" y="692" class="role">matplotlib 日本語書体</text>
    <text x="455" y="660" class="note">画面（views/）とレポートが同じ絵を出すために、描画も「下」へ置いている。</text>
    <text x="455" y="680" class="note">＝ 2 つの層から使うものは共有の箱ではなく、下の層の住人にする。</text>
  </g>

  <line class="arrow" x1="639" y1="728" x2="639" y2="752"/>

  <!-- core -->
  <rect class="band" x="20" y="756" width="1238" height="448" rx="10" fill="#fff6e9" stroke="#f0dcbe"/>
  <text x="34" y="780" class="lname" fill="#7a4f16">core/ — 土台（計算・データ・設定）</text>
  <text x="1244" y="780" class="lrule" text-anchor="end">tkinter も matplotlib も引かない。</text>
  <g>
    <rect class="card" x="34" y="804" width="395" height="76" rx="6" stroke="#f0dcbe"/>
    <text x="46" y="821" class="ctitle" fill="#7a4f16">オーケストレーション</text>
    <text x="46" y="842" class="mod">simulation.py</text> <text x="214" y="842" class="role">DEM 取得管理・地形・計算</text>
    <text x="46" y="862" class="mod">scenario.py</text> <text x="214" y="862" class="role">条件探索の共有ランナー</text>
    <rect class="card" x="443" y="804" width="399" height="256" rx="6" stroke="#f0dcbe"/>
    <text x="455" y="821" class="ctitle" fill="#7a4f16">純粋（副作用ゼロ）</text>
    <text x="455" y="842" class="mod">models.py</text> <text x="623" y="842" class="role">伝搬計算</text>
    <text x="455" y="862" class="mod">coords.py</text> <text x="623" y="862" class="role">座標表記（DD ⇔ DMS）</text>
    <text x="455" y="882" class="mod">units.py</text> <text x="623" y="882" class="role">距離の表示整形（km → m）</text>
    <text x="455" y="902" class="mod">output_contract.py</text> <text x="623" y="902" class="role">成果物 CSV の列仕様</text>
    <text x="455" y="922" class="mod">batch_csv_schema.py</text> <text x="623" y="922" class="role">バッチ入力 CSV の列仕様</text>
    <text x="455" y="942" class="mod">terrain_grid.py</text> <text x="623" y="942" class="role">解像度の段階 → 点数</text>
    <text x="455" y="962" class="mod">diffraction.py</text> <text x="623" y="962" class="role">回折損（Bullington・J(ν)）</text>
    <text x="455" y="982" class="mod">ground_reflection.py</text> <text x="623" y="982" class="role">地面反射の振幅包絡線（2波干渉）</text>
    <text x="455" y="1002" class="mod">sensitivity.py</text> <text x="623" y="1002" class="role">摂動再計算＝余裕度の幅</text>
    <text x="455" y="1022" class="mod">residuals.py</text> <text x="623" y="1022" class="role">実測との残差＝層別の中央値・ばらつき</text>
    <text x="455" y="1042" class="mod">disclosure.py</text> <text x="623" y="1042" class="role">帳票の開示の字（前提・適用範囲）</text>
    <rect class="card" x="856" y="804" width="388" height="176" rx="6" stroke="#f0dcbe"/>
    <text x="868" y="821" class="ctitle" fill="#7a4f16">設定・環境・文字列</text>
    <text x="868" y="842" class="mod">config.py</text> <text x="1036" y="842" class="role">設定 I/O・検証・ログ</text>
    <text x="868" y="862" class="mod">runtime_env.py</text> <text x="1036" y="862" class="role">宣言された実行系の判定</text>
    <text x="868" y="882" class="mod">env_facts.py</text> <text x="1036" y="882" class="role">環境事実の収集層（診断・刻印）</text>
    <text x="868" y="902" class="mod">i18n.py</text> <text x="1036" y="902" class="role">文字列表＋ lang/*.json</text>
    <text x="868" y="922" class="mod">version.py</text> <text x="1036" y="922" class="role">バージョン情報</text>
    <text x="868" y="942" class="mod">failure.py</text> <text x="1036" y="942" class="role">失敗メッセージの型</text>
    <text x="868" y="962" class="mod">diagnostics.py</text> <text x="1036" y="962" class="role">診断パッケージ（成果物は既定除外）</text>
  </g>
  <g>
    <rect class="card" x="34" y="1074" width="395" height="116" rx="6" stroke="#f0dcbe"/>
    <text x="46" y="1091" class="ctitle" fill="#7a4f16">DEM 層</text>
    <text x="46" y="1112" class="mod">dem.py</text> <text x="214" y="1112" class="role">DEM・タイルの取得とキャッシュ I/O</text>
    <text x="46" y="1132" class="mod">dem_sources.py</text> <text x="214" y="1132" class="role">DEM ソースの宣言（URL・復号）</text>
    <text x="46" y="1152" class="mod">dem_cache.py</text> <text x="214" y="1152" class="role">キャッシュ棚卸し・カバレッジ・削除</text>
    <text x="46" y="1172" class="mod">dem_prefetch.py</text> <text x="214" y="1172" class="role">面での事前取得</text>
    <text x="455" y="1100" class="note">HTTP・プロキシ・ディスクキャッシュは dem.py の中だけ。</text>
    <text x="455" y="1120" class="note">＝ ほかの層は「取れた標高」しか知らない。</text>
  </g>

  <text x="20" y="1232" class="note">main.py は層に属さない（起動して views を組み立てるだけ）。層をまたぐ逆流と import 時の循環は tests/test_layers.py が機械で止める。</text>
  <text x="20" y="1252" class="note">この図は 1 つの表から生成している（座標を手で書かない）。作り直し方と検査は開発者ガイドの「レイヤー構成」にある。</text>
</svg>
